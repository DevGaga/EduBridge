{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apply | EduBridge</title>
  <link rel="stylesheet" href="{% static 'accounts/css/main.css' %}" />
  <style>
    .apply-card {
      max-width: 760px;
      margin: 3rem auto;
      background: #fff;
      border: 1px solid #d9e1ec;
      border-radius: 20px;
      padding: 2rem;
      box-shadow: 0 14px 38px rgba(20, 32, 51, 0.08);
    }

    .apply-card form {
      display: grid;
      gap: 1rem;
      margin-top: 1rem;
    }

    .apply-card textarea {
      min-height: 180px;
      padding: 1rem;
      border: 1px solid #d9e1ec;
      border-radius: 12px;
      font: inherit;
    }
  </style>
</head>
<body>
  <header class="navbar">
    <h1>EduBridge</h1>
    <nav>
      <a href="{% url 'home' %}">Home</a>
      <a href="{% url 'students:student_dashboard' %}">Dashboard</a>
      <a href="{% url 'accounts:logout' %}">Logout</a>
    </nav>
  </header>

  <main class="apply-card">
    <h2>Apply for {{ opportunity.title }}</h2>
    <p><strong>Institution:</strong> {{ opportunity.institution }}</p>
    <p><strong>Deadline:</strong> {{ opportunity.deadline }}</p>

    <form method="post">
      {% csrf_token %}
      <label for="cover_letter">Cover Letter</label>
      <textarea id="cover_letter" name="cover_letter" required></textarea>
      <button type="submit">Submit Application</button>
    </form>
  </main>
</body>
</html>
