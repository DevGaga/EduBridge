{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Institution Login | EduBridge</title>
  <link rel="stylesheet" href="{% static 'accounts/css/login.css' %}" />
</head>
<body>
  <header class="navbar">
    <h1>EduBridge</h1>
    <nav>
      <a href="{% url 'home' %}">Home</a>
      <a href="{% url 'accounts:student_signup' %}">Sign Up</a>
    </nav>
  </header>

  <main class="login-section">
    <h2>Institution Login</h2>
    {% if form.errors %}
<div style="background:#ffebee;color:#c62828;padding:10px;margin-bottom:15px;">
    {{ form.errors }}
</div>
{% endif %}

    <form method="post" action="{% url 'accounts:institution_login' %}" id="login-form">
      {% csrf_token %}
      <label for="id_username">Email Address</label>
      <input type="text" name="username" id="id_username" placeholder="Email Address" required />

      <label for="id_password">Password</label>
      <input type="password" name="password" id="id_password" placeholder="Password" required />

      <button type="submit">Login</button>
    </form>
  </main>

  <script src="{% static 'accounts/scripts/login.js' %}"></script>
</body>
</html>
