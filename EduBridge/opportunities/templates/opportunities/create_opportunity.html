{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Opportunity | EduBridge</title>
  <link rel="stylesheet" href="{% static 'accounts/css/main.css' %}" />
  <style>
    .form-card {
      max-width: 720px;
      margin: 3rem auto;
      background: #fff;
      border: 1px solid #d9e1ec;
      border-radius: 20px;
      padding: 2rem;
      box-shadow: 0 14px 38px rgba(20, 32, 51, 0.08);
    }

    .form-card h2 {
      margin-bottom: 1.25rem;
      color: #102946;
    }

    .form-card form {
      display: grid;
      gap: 1rem;
    }

    .form-card input,
    .form-card select,
    .form-card textarea {
      width: 100%;
      padding: 0.9rem 1rem;
      border: 1px solid #d9e1ec;
      border-radius: 12px;
      font: inherit;
    }
  </style>
</head>
<body>
  <header class="navbar">
    <h1>EduBridge</h1>
    <nav>
      <a href="{% url 'home' %}">Home</a>
      <a href="{% url 'institutions:dashboard' %}">Dashboard</a>
      <a href="{% url 'accounts:logout' %}">Logout</a>
    </nav>
  </header>

  <main class="form-card">
    <h2>Create a New Opportunity</h2>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Publish Opportunity</button>
    </form>
  </main>
</body>
</html>
