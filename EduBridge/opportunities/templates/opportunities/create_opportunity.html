{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Opportunity | EduBridge</title>
  <link rel="stylesheet" href="{% static 'accounts/css/main.css' %}" />
  <link rel="stylesheet" href="{% static 'opportunities/css/create_opportunity.css' %}" />
</head>
<body>
  <header class="navbar">
    <h1>EduBridge</h1>
    <nav>
      <a href="{% url 'home' %}">Home</a>
      <a href="{% url 'institutions:dashboard' %}">Dashboard</a>
      <a href="{% url 'accounts:logout' %}">Logout</a>
    </nav>
  </header>

  <main class="form-card">
    <h2>Create a New Opportunity</h2>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Publish Opportunity</button>
    </form>
  </main>
</body>
</html>
